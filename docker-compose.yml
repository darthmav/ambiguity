# The console in a container, wired to the machine it runs on.
#
#   docker compose up --build                    # Arch    (dockerfile)
#
# Host networking is the whole configuration decision here, and it is what
# makes the database work unchanged. The postgres18 container Omarchy's
# installer runs -- the one this project's install.sh brings up -- publishes
# its port on 127.0.0.1:5432 and nowhere else, which is why it can afford trust
# authentication. A container on a bridge network reaches the host through the
# gateway address, which is not an address that port is published on, so a
# bridged console cannot see the database at all without republishing it to the
# world or attaching both containers to a network of their own (README.md >
# Running in a container has that recipe). On the host network the URL in .env
# means the same thing inside the container as outside it.
#
# The same reasoning covers the other two things on this machine the console
# talks to: the Ollama daemon on 127.0.0.1:11434, which serves every seat and
# holds the embedding model, and the SearxNG install.sh runs on 127.0.0.1:8888.
# Bridging would have to solve all three, one env var at a time.

name: ambiguity

services:
  console:
    build:
      context: .
      dockerfile: dockerfile
    image: ambiguity-console:latest

    network_mode: host

    # The uid that owns the checkout on the host, so a run's products are not
    # left root-owned in your working tree. 1000 is the first human account on an
    # Arch/Omarchy install; override for any other (AMBIGUITY_UID=$(id -u)).
    user: "${AMBIGUITY_UID:-1000}:${AMBIGUITY_GID:-1000}"

    # The checkout itself, because a corpus is a function of what is on disk: the
    # project the agents index and write to, knowledge/ (Chroma and the graph),
    # runs/, uploads/, research/web/ and projects/ all live in it, and a container
    # that kept them inside its own layer would throw away the corpus -- and the
    # relevance floor measured for it -- on every rebuild. It is also what gives
    # the Builder's git_ tools a real repository with a real origin.
    #
    # To let git_dwell finish its default pipeline as you rather than as the
    # container's fallback identity, add your own credentials, read-only -- the
    # entrypoint supplies safe.directory through the environment precisely so
    # these need no writes. Both must exist on the host before uncommenting, or
    # Docker creates a directory in their place.
    #   - ${HOME}/.gitconfig:/home/agent/.gitconfig:ro
    #   - ${HOME}/.config/gh:/home/agent/.config/gh:ro
    volumes:
      - .:/app

    environment:
      # These fall back to the values in .env (compose reads it for
      # interpolation) and then to the machine defaults, so setting one in .env
      # sets it in both halves rather than only one.
      PORT: "${PORT:-8080}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}"
      # The URL install.sh writes into .env after proving it logs in. Nothing in
      # the app reads it; the console exports it to everything it runs, so a
      # script the Builder writes finds the database here.
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres@127.0.0.1:5432/postgres}"

    # A console is something you start and watch, not a service that should come
    # back by itself: a run holds process-global state (the stop flag, the corpus
    # rebuild claim), and its snapshot under runs/ is what a restarted console
    # reattaches to.
    restart: "no"
    stop_grace_period: 30s
