# The console in a container, wired to the machine it runs on.
#
#   docker compose up --build                    # Arch    (dockerfile)
#
# Two services. `postgres` is the stack's own database, where the container's
# corpus lives: pgvector's build of postgres:18, on a volume of its own, so
# `docker compose up` needs no database on the host. `console` waits for it to
# be healthy before it starts.
#
# The console is on the host network. It talks to two things on this machine,
# both loopback-only on purpose -- the Ollama daemon on 127.0.0.1:11434, which
# serves every seat and holds the embedding model, and the SearxNG install.sh
# runs on 127.0.0.1:8888 -- and a bridged container reaches neither: the
# gateway address it would use is not an address either is published on.
#
# The database is the other way round, on Docker's bridge with its port
# published on 127.0.0.1 only. It trusts every connection (no password), so it
# must not share the host network: there the server listens on every
# interface, and the machine's LAN could log in. Published on loopback, it is
# reachable from the host-network console at 127.0.0.1 and from nothing else.
# Port 5433, so it never meets the host's own postgres18 on 5432 (install.sh's,
# which a console started on the host uses): the two corpora never mix.

name: ambiguity

services:
  postgres:
    # The image install.sh runs on the host: postgres:18 with pgvector, on the
    # same Debian release so its collations match a postgres:18 data directory.
    image: pgvector/pgvector:pg18-trixie
    environment:
      # Trust, as the host's postgres18 does: development data, reachable only
      # over the loopback publish below.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${AMBIGUITY_DB_PORT:-5433}:5432"
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql/18/, so the volume
      # goes on the parent, as the image documents.
      - pgdata:/var/lib/postgresql
    # Ready means accepting TCP: during first-start initialisation the image
    # runs a temporary server on the Unix socket alone, which a socket check
    # would mistake for the real one.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    # Stopped with the stack, like the console; `docker compose up` brings both.
    restart: "no"

  console:
    build:
      context: .
      dockerfile: dockerfile
    image: ambiguity-console:latest

    network_mode: host

    # The corpus cannot be stored without the database, so the console starts
    # only once it accepts connections.
    depends_on:
      postgres:
        condition: service_healthy

    # The uid that owns the checkout on the host, so a run's products are not
    # left root-owned in your working tree. 1000 is the first human account on an
    # Arch/Omarchy install; override for any other (AMBIGUITY_UID=$(id -u)).
    user: "${AMBIGUITY_UID:-1000}:${AMBIGUITY_GID:-1000}"

    # The container never writes into your checkout, and nothing a host console
    # writes reaches the container: the two cannot share a corpus, a run
    # snapshot, an upload or a generated project. Both keep their corpus in the
    # one database, each in its own schema: a schema is named after the corpus
    # directory's resolved path, /app/knowledge here and the checkout's on the
    # host, so the two never meet.
    #
    #  * Code comes from the checkout, read-only, path by path -- not the whole
    #    tree. A volume mounted under a read-only checkout makes Docker create
    #    its mount point *in the checkout* (an empty uploads/, which must not
    #    exist there until someone uploads), and the whole tree is also where
    #    runs/ and .env live.
    #  * Everything the app writes is a named volume of this project, so a
    #    rebuild keeps the archive the corpus is built from, and
    #    `docker compose down -v` is the one command that forgets it. The corpus
    #    itself -- vectors, graph, floor -- is in the database, which no volume
    #    here holds. The
    #    dockerfile creates each directory owned by uid 1000, which is what makes
    #    a fresh volume writable by the user the container runs as.
    #  * .env is config, read-only; it must exist on the host (install.sh makes
    #    it), and compose refuses to start rather than create a directory there.
    #
    # The Builder's git_ tools see the repository baked into the image, a copy
    # that is as old as the last `--build`, so what a run commits there is not
    # the host's branch. To let git_dwell finish its default pipeline as you
    # rather than as the container's fallback identity, add your own credentials,
    # read-only -- the entrypoint supplies safe.directory through the
    # environment precisely so these need no writes. Both must exist on the host
    # before uncommenting, or Docker creates a directory in their place.
    #   - ${HOME}/.gitconfig:/home/agent/.gitconfig:ro
    #   - ${HOME}/.config/gh:/home/agent/.config/gh:ro
    volumes:
      - ./src:/app/src:ro
      - ./serve.py:/app/serve.py:ro
      - ./frontend:/app/frontend:ro
      - ./prompts:/app/prompts:ro
      - ./spectral_graph:/app/spectral_graph:ro
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - runs:/app/runs
      - uploads:/app/uploads
      - research-web:/app/research/web
      - projects:/app/projects
      - diagnostics:/app/reports/diagnostics
      - experimental:/app/experimental

    environment:
      # These fall back to the values in .env (compose reads it for
      # interpolation) and then to the machine defaults, so setting one in .env
      # sets it in both halves rather than only one. PORT is the exception.
      # Its own port, not .env's PORT: a console started on the host from the
      # same .env takes 8080, and on the host network two cannot share it.
      PORT: "${AMBIGUITY_PORT:-8081}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}"
      # The stack's own database, never .env's: that URL names the host's
      # postgres18, and this container's corpus belongs with this stack. Set
      # here, the environment wins over the .env config.py loads. The console
      # also exports it to everything it runs, so a script the Builder writes
      # finds the database here.
      DATABASE_URL: "postgresql://postgres@127.0.0.1:${AMBIGUITY_DB_PORT:-5433}/postgres"

    # A console is something you start and watch, not a service that should come
    # back by itself: a run holds process-global state (the stop flag, the corpus
    # rebuild claim), and its snapshot under runs/ is what a restarted console
    # reattaches to.
    restart: "no"

    # How long `docker compose stop` waits before it kills. SIGTERM stops the
    # run and defers the exit until its snapshot is written, but a stop never
    # cuts a seat call short: the node in flight returns when its call does, or
    # at its deadline. So this outlasts the longest deadline a node runs under,
    # BUILDER_DEADLINE_SECONDS as .env.example sets it, with room for the
    # teardown -- anything shorter kills the process, and the snapshot with it.
    # README.md's `podman run --stop-timeout` is the same figure, and
    # tests/test_claims.py holds both to it.
    stop_grace_period: 900s

volumes:
  # The database's data: the container's corpus. `docker compose down -v`
  # forgets it with the rest.
  pgdata:
  runs:
  uploads:
  research-web:
  projects:
  diagnostics:
  experimental:
