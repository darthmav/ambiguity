[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-agent"
version = "0.2.0"
description = "4-Agent AI System: Architect, Planner, Researcher, Builder"
# numpy 2.5 and scipy 1.18 require 3.12; nothing older is tested.
requires-python = ">=3.12"
# Everything the package imports directly is declared here, even when it would
# arrive transitively: a dependency left implicit breaks the day the one that
# carries it moves. Floors mark where each API in use begins.
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # A seat whose provider will not import silently becomes StubLLM, so every
    # provider a seat can be pointed at is declared.
    "langchain-ollama>=0.2.0",     # every default seat
    "langchain-anthropic>=0.2.0",
    "ollama>=0.4.0",               # ollama_client.py
    "pydantic>=2.0",               # SecretStr for provider keys
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",               # online research
    "chromadb>=0.5.0",
    # The chunker cuts with the embedding model's own tokenizer; nothing embeds
    # in-process.
    "transformers>=4.51.0",
    "networkx>=3.0",
    # spectral_graph and the corpus diagnostics built on it.
    "numpy>=2.0",
    "scipy>=1.14",
    # self_healing: retries with backoff, and circuit breakers.
    "tenacity>=8.2.0",
    "pybreaker>=1.2.0",
]

[project.optional-dependencies]
# Run by the Builder's own belt under the console's interpreter: the lint pass
# is `ruff check` and the test tools are pytest. The container installs this.
tools = [
    "pytest>=7.0",
    "ruff==0.16.9",                # the version CI lints with; bump both together
]
dev = [
    "langgraph-agent[tools]",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
# Collection starts at tests/ alone: a bare `pytest` from the root must never
# import a root-level script.
testpaths = ["tests"]
# The root on the path for a bare `pytest` as for `python -m pytest`: the tests
# import `serve` and `spectral_graph`, which live there uninstalled.
pythonpath = ["."]

# Packages live under src/ alone. `spectral_graph`, `tests` and `scripts` sit
# at the root and stay out of the distribution; `spectral_graph` is importable
# with the project root on sys.path, which is why the package imports it
# inside the functions that need it.
[tool.setuptools.packages.find]
where = ["src"]
