# The checks from CLAUDE.md's Quick Reference, run on every push and pull
# request. The commands are copied verbatim from that section, and
# tests/test_claims.py holds the two to it.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ruff needs none of the project's dependencies, so it runs on its own and
  # reports in well under a minute instead of waiting for the install below.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        # The exact version pyproject's tools extra pins, so a new ruff release
        # cannot start failing CI on a rule it turned on.
        run: pip install "ruff==0.16.9"
      - name: Lint
        run: ruff check src/ tests/ serve.py scripts/ spectral_graph/ example_usage.py ollama_client.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One version failing is worth knowing about even when the other is
      # still running.
      fail-fast: false
      matrix:
        # The floor pyproject requires, and the version the project is
        # developed on.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Type check
        run: mypy src/langgraph_agent/ serve.py ollama_client.py spectral_graph/

      - name: Tests
        run: python -m pytest tests/ -v
